<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TVA Terminal & Miss Minutes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --tva-bg: #8c6b4a;
      --tva-bezel: #c24423;
      --screen-bg: #0c0804;
      --tva-amber: #ffb000;
      --tva-amber-dim: rgba(255, 176, 0, 0.3);
      --tva-red: #ff3333;
      --tva-green: #45c486;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #7a5836 0%, #3d2b1a 100%);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* === РЕТРО-МОНИТОР TVA === */

    .tva-monitor {
      position: relative;
      width: 100%;
      max-width: 900px;
      background: #1a1a1a;
      border: 18px solid var(--tva-bezel);
      border-radius: 40px 40px 50px 50px;
      padding: 25px;
      box-shadow:
        inset 0 0 20px rgba(0,0,0,0.8),
        0 20px 40px rgba(0,0,0,0.7),
        0 50px 100px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .tva-screen {
      position: relative;
      width: 100%;
      height: 620px;
      background: var(--screen-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0,0,0,1);
      display: flex;
      flex-direction: column;
    }

    .screen-glass {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: radial-gradient(
        circle at center,
        transparent 40%,
        rgba(0,0,0,0.6) 100%
      );
      box-shadow: inset 0 0 15px rgba(255,255,255,0.05);
    }

    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 49;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.2) 2px,
        transparent 2px,
        transparent 4px
      );
    }

    /* === ВЕРХ: СВЯЩЕННАЯ ЛИНИЯ === */

    .timeline-panel {
      position: relative;
      width: 100%;
      height: 160px;
      border-bottom: 2px solid var(--tva-amber-dim);
      background: radial-gradient(
        circle at 50% 50%,
        #15100a 0%,
        #0c0804 100%
      );
      flex-shrink: 0;
      overflow: hidden;
    }

    .timeline-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.85;
    }

    .sacred-path {
      fill: none;
      stroke: #fff;
      stroke-width: 3;
      filter:
        drop-shadow(0 0 8px #fff)
        drop-shadow(0 0 15px var(--tva-amber));
      animation: pulseLine 3s infinite alternate;
    }

    .nexus-branch {
      fill: none;
      stroke: var(--tva-red);
      stroke-width: 4;
      filter: drop-shadow(0 0 10px var(--tva-red));
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
    }

    .draw-branch {
      animation: drawPath 8s ease-in-out forwards;
    }

    @keyframes pulseLine {
      0% {
        opacity: 0.7;
      }

      100% {
        opacity: 1;
        stroke-width: 4px;
      }
    }

    @keyframes drawPath {
      to {
        stroke-dashoffset: 0;
      }
    }

    .hud-top {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      color: var(--tva-amber);
      text-shadow: 0 0 5px var(--tva-amber);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      z-index: 10;
    }

    /* === НИЗ: ВОПРОСЫ И ОТВЕТЫ === */

    .quiz-panel {
      position: relative;
      z-index: 10;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 30px 30px;
      color: var(--tva-amber);
      text-shadow: 0 0 5px var(--tva-amber);
      overflow-y: auto;
    }

    .question-box {
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .question-box h1 {
      margin: 0 0 15px 0;
      font-size: 22px;
      line-height: 1.4;
    }

    .qnum {
      font-size: 12px;
      color: #a87b2b;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
      padding-right: 10px;
      padding-bottom: 20px;
    }

    .answers::-webkit-scrollbar {
      width: 8px;
    }

    .answers::-webkit-scrollbar-track {
      background: rgba(255, 176, 0, 0.1);
      border-radius: 4px;
    }

    .answers::-webkit-scrollbar-thumb {
      background: var(--tva-amber);
      border-radius: 4px;
    }

    button.answer {
      background: rgba(255, 176, 0, 0.05);
      border: 1px solid var(--tva-amber);
      color: var(--tva-amber);
      font-family: var(--font-mono);
      font-size: 16px;
      padding: 15px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
      text-shadow: 0 0 5px var(--tva-amber);
    }

    button.answer:hover:not(:disabled) {
      background: var(--tva-amber);
      color: var(--screen-bg);
      text-shadow: none;
      transform: translateX(5px);
    }

    button.answer:disabled {
      cursor: default;
    }

    .answer.correct {
      background: var(--tva-green) !important;
      color: #000 !important;
      border-color: var(--tva-green);
      text-shadow: none;
      box-shadow: 0 0 15px var(--tva-green);
    }

    .answer.wrong {
      background: var(--tva-red) !important;
      color: #fff !important;
      border-color: var(--tva-red);
      text-shadow: none;
      box-shadow: 0 0 15px var(--tva-red);
    }

    .answers.answered button.answer:not(.correct):not(.wrong) {
      opacity: 0.3;
    }

    .terminal-btn {
      background: transparent;
      border: 2px solid var(--tva-amber);
      color: var(--tva-amber);
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: bold;
      padding: 12px 25px;
      cursor: pointer;
      margin-top: 10px;
      text-transform: uppercase;
      text-shadow: 0 0 5px var(--tva-amber);
      transition: 0.2s;
      display: inline-block;
    }

    .terminal-btn.right {
      align-self: flex-end;
    }

    .terminal-btn:hover {
      background: var(--tva-amber);
      color: #000;
      text-shadow: none;
    }

    .terminal-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .hidden {
      display: none !important;
    }

    /* === ПОЛЕ ИМЕНИ === */

    .tva-input {
      background: rgba(0,0,0,0.5);
      border: 2px solid var(--tva-amber);
      color: var(--tva-amber);
      font-family: var(--font-mono);
      font-size: 18px;
      padding: 12px;
      width: 100%;
      max-width: 300px;
      text-align: center;
      margin-bottom: 15px;
      text-transform: uppercase;
      outline: none;
    }

    .tva-input::placeholder {
      color: var(--tva-amber-dim);
    }

    .tva-input:focus {
      box-shadow: 0 0 15px var(--tva-amber-dim);
    }

    /* === ТАБЛИЦА ЛИДЕРОВ === */

    .leaderboard-table {
      width: 100%;
      max-width: 480px;
      margin: 20px auto;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }

    .leaderboard-table th {
      border-bottom: 1px solid var(--tva-amber);
      padding: 8px;
      color: var(--tva-amber-dim);
    }

    .leaderboard-table td {
      padding: 8px;
      border-bottom: 1px dotted var(--tva-amber-dim);
    }

    .leaderboard-table tr:first-child td {
      color: var(--tva-green);
      font-weight: bold;
      text-shadow: 0 0 5px var(--tva-green);
    }

    .leaderboard-error {
      color: var(--tva-red);
      line-height: 1.5;
      padding: 15px;
    }

    /* === GLITCH === */

    .glitch-screen {
      animation: screenGlitch 0.4s;
    }

    @keyframes screenGlitch {
      0% {
        transform: translate(0);
        filter: hue-rotate(0);
      }

      20% {
        transform: translate(-4px, 4px);
        filter: hue-rotate(-90deg);
      }

      40% {
        transform: translate(4px, -4px);
        filter: hue-rotate(90deg);
      }

      60% {
        transform: translate(-2px, 2px);
      }

      100% {
        transform: translate(0);
        filter: hue-rotate(0);
      }
    }

    /* === MISS MINUTES === */

    .miss-minutes-container {
      position: absolute;
      bottom: -10px;
      left: -130px;
      width: 220px;
      height: auto;
      z-index: 100;
      animation: float 4s ease-in-out infinite;
      transition: all 0.3s ease;
      filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6));
      pointer-events: none;
    }

    .miss-minutes-container img {
      width: 100%;
      height: auto;
      display: block;
      transition: all 0.3s ease;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    .is-angry {
      animation: shake-angry 0.2s infinite !important;
      filter:
        drop-shadow(0 0 30px rgba(255, 0, 0, 1))
        sepia(1)
        hue-rotate(-50deg)
        saturate(5) !important;
    }

    @keyframes shake-angry {
      0% {
        transform: translate(0, 0) scale(1.1);
      }

      25% {
        transform: translate(-8px, 8px) scale(1.1);
      }

      50% {
        transform: translate(8px, -5px) scale(1.1);
      }

      75% {
        transform: translate(-8px, -8px) scale(1.1);
      }

      100% {
        transform: translate(0, 0) scale(1.1);
      }
    }

    .is-happy {
      animation: bounce-happy 0.4s ease-in-out infinite alternate !important;
      filter:
        drop-shadow(0 0 30px rgba(255, 204, 0, 1))
        brightness(1.2)
        saturate(1.5) !important;
    }

    @keyframes bounce-happy {
      0% {
        transform: translateY(0) scale(1);
      }

      100% {
        transform: translateY(-30px) scale(1.05);
      }
    }

    /* === МОБИЛЬНАЯ ВЕРСИЯ === */

    @media (max-width: 900px) {
      body {
        padding: 10px;
      }

      .tva-monitor {
        padding: 15px;
        border-width: 12px;
        border-radius: 20px;
      }

      .tva-screen {
        height: 600px;
      }

      /*
       * Miss Minutes специально опускаем ниже.
       * Она больше не перекрывает нижние варианты ответа.
       */
      .miss-minutes-container {
        left: -15px;
        width: 105px;
        bottom: -90px;
        z-index: 1;
      }

      .quiz-panel {
        padding: 18px 18px 25px;
      }

      .question-box h1 {
        font-size: 20px;
      }

      button.answer {
        font-size: 15px;
        padding: 13px;
      }

      .hud-top {
        left: 12px;
        right: 12px;
        font-size: 11px;
        letter-spacing: 1px;
      }

      .leaderboard-table {
        font-size: 12px;
      }

      .leaderboard-table th,
      .leaderboard-table td {
        padding: 6px 4px;
      }
    }

    @media (max-width: 500px) {
      body {
        padding: 5px;
      }

      .tva-monitor {
        border-width: 8px;
        padding: 8px;
      }

      .tva-screen {
        height: 620px;
      }

      .timeline-panel {
        height: 135px;
      }

      .quiz-panel {
        padding: 15px 12px 20px;
      }

      .question-box h1 {
        font-size: 18px;
      }

      button.answer {
        font-size: 14px;
        padding: 12px;
      }

      .terminal-btn {
        font-size: 14px;
        padding: 10px 16px;
      }

      .miss-minutes-container {
        width: 90px;
        left: -10px;
        bottom: -85px;
      }

      .leaderboard-table {
        max-width: 100%;
        font-size: 11px;
      }
    }
  </style>
</head>

    // ============================================================

    let lang = "ru";

    // ============================================================

    function setLanguage(selectedLang) {

      lang = selectedLang;
      questions = db[lang];

      document.getElementById("uiTitle").textContent =
        i18n[lang].title;

      document.getElementById("uiSubtitle").textContent =

        .classList.add("hidden");

        .classList.remove("hidden");
    }


    // ============================================================
    // MISS MINUTES
    // ============================================================

    function resetMissMinutes() {

      const npc =
        document.getElementById("missMinutes");

      const mmImage =
        document.getElementById("mmImage");

      npc.className =
        "miss-minutes-container";

      mmImage.src =
        "miss_normal.png";

      document.getElementById("tvaScreen")
        .classList.remove("glitch-screen");

      document.getElementById("nexusBranch")
        .classList.remove("draw-branch");
    }


    // ============================================================
    // СТАРТ
    // ============================================================

    function startQuiz() {

      i = 0;
      score = 0;
      answered = false;

      document.getElementById("startScreen")
        .classList.add("hidden");

      document.getElementById("resultScreen")
        .classList.add("hidden");

      document.getElementById("leaderboardInputSection")
        .classList.remove("hidden");

      document.getElementById("leaderboardViewSection")
        .classList.add("hidden");

      document.getElementById("quizContainer")
        .classList.remove("hidden");

      render();
    }


    // ============================================================
    // РЕНДЕР ВОПРОСА
    // ============================================================

    function render() {

      answered = false;

      resetMissMinutes();

      const q = questions[i];

      document.getElementById("qnum").textContent =
        `${i18n[lang].query} ${i + 1} ${i18n[lang].of} ${questions.length}`;

      document.getElementById("question").textContent =
        q[0];

      document.getElementById("scoreTop").textContent =
        `${i18n[lang].vars}: ${score}/${questions.length}`;

      const explain =
        document.getElementById("explainText");

      explain.textContent = "";
      explain.classList.add("hidden");

      document.getElementById("nextBtn")
        .classList.add("hidden");

      const box =
        document.getElementById("answers");

      box.innerHTML = "";
      box.classList.remove("answered");

      q[1].forEach((answer, idx) => {

        const button =
          document.createElement("button");

        button.className = "answer";

        button.textContent =
          `[${String.fromCharCode(65 + idx)}] ${answer}`;

        button.onclick = () =>
          choose(idx, button);

        box.appendChild(button);
      });

      const branch =
        document.getElementById("nexusBranch");

      branch.style.animation = "none";

      branch.offsetHeight;

      branch.style.animation = null;
    }


    // ============================================================
    // ОТВЕТ
    // ============================================================

    function choose(idx, btn) {

      if (answered) {
        return;
      }

      answered = true;

      const q = questions[i];

      const buttons =
        [...document.querySelectorAll(".answer")];

      const box =
        document.getElementById("answers");

      box.classList.add("answered");

      buttons.forEach(button => {
        button.disabled = true;
      });

      const correct =
        q[2];

      const npc =
        document.getElementById("missMinutes");

      const mmImage =
        document.getElementById("mmImage");

      const explain =
        document.getElementById("explainText");

      if (idx === correct) {

        score++;

        btn.classList.add("correct");

        npc.classList.add("is-happy");

        mmImage.src =
          "miss_normal.png";

        explain.style.color =
          "var(--tva-green)";

        explain.textContent =
          i18n[lang].confirmed;

      } else {

        btn.classList.add("wrong");

        buttons[correct]
          .classList.add("correct");

        npc.classList.add("is-angry");

        mmImage.src =
          "miss_angry.png";

        document.getElementById("nexusBranch")
          .classList.add("draw-branch");

        document.getElementById("tvaScreen")
          .classList.add("glitch-screen");

        explain.style.color =
          "var(--tva-red)";

        explain.textContent =
          i18n[lang].variance +
          q[1][correct];
      }

      explain.classList.remove("hidden");

      document.getElementById("scoreTop").textContent =
        `${i18n[lang].vars}: ${score}/${questions.length}`;

      const nextBtn =
        document.getElementById("nextBtn");

      nextBtn.classList.remove("hidden");

      nextBtn.textContent =
        i === questions.length - 1
          ? i18n[lang].btnAnalysis
          : i18n[lang].btnNext;

      clearTimeout(npcTimer);

      npcTimer =
        setTimeout(resetMissMinutes, 4000);
    }


    // ============================================================
    // СЛЕДУЮЩИЙ ВОПРОС
    // ============================================================

    function nextQuestion() {

      if (i < questions.length - 1) {

        i++;

        render();

        document
          .querySelector(".quiz-panel")
          .scrollTo({
            top: 0,
            behavior: "smooth"
          });

      } else {

        finish();
      }
    }


    // ============================================================
    // РЕЗУЛЬТАТ
    // ============================================================

    function finish() {

      document.getElementById("quizContainer")
        .classList.add("hidden");

      document.getElementById("resultScreen")
        .classList.remove("hidden");

      document.getElementById("playerName")
        .value = "";

      document.getElementById("leaderboardInputSection")
        .classList.remove("hidden");

      document.getElementById("leaderboardViewSection")
        .classList.add("hidden");

      resetMissMinutes();

      document.getElementById("finalScore").textContent =
        `${score} / ${questions.length}`;

      const ranksData =
        i18n[lang].ranks;

      let rankText =
        ranksData[ranksData.length - 1].t;

      let descText =
        ranksData[ranksData.length - 1].d;

      for (const rank of ranksData) {

        if (score >= rank.min) {

          rankText = rank.t;
          descText = rank.d;

          break;
        }
      }

      document.getElementById("rank").textContent =
        rankText;

      document.getElementById("resultText").textContent =
        descText;

      const npc =
        document.getElementById("missMinutes");

      const mmImage =
        document.getElementById("mmImage");

      if (score >= 38) {

        npc.classList.add("is-happy");

        mmImage.src =
          "miss_normal.png";

      } else {

        npc.classList.add("is-angry");

        mmImage.src =
          "miss_angry.png";
      }
    }


    // ============================================================
    // СОХРАНЕНИЕ РЕЗУЛЬТАТА В GOOGLE SHEETS
    // ============================================================

    async function saveScore() {

      if (savingScore) {
        return;
      }

      let name =
        document
          .getElementById("playerName")
          .value
          .trim();

      if (!name) {
        name = "VARIANT_UNKNOWN";
      }

      name = name.substring(0, 30);

      const saveButton =
        document.getElementById("uiBtnSave");

      savingScore = true;

      saveButton.disabled = true;

      saveButton.textContent =
        lang === "ru"
          ? "СОХРАНЕНИЕ..."
          : "SAVING...";

      try {

        /*
         * Используем URLSearchParams.
         *
         * Это обычный form-urlencoded POST,
         * который не требует JSON preflight.
         */

        const body =
          new URLSearchParams({
            action: "submit",
            name: name,
            score: String(score),
            correct: String(score),
            total: String(questions.length),
            language: lang.toUpperCase()
          });

        const response =
          await fetch(LEADERBOARD_API, {
            method: "POST",
            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded;charset=UTF-8"
            },
            body: body.toString()
          });

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const result =
          await response.json();

        if (!result.success) {
          throw new Error(
            result.error || "Unknown API error"
          );
        }

        /*
         * После успешного сохранения
         * загружаем актуальный общий рейтинг.
         */

        await loadLeaderboard();

      } catch (error) {

        console.error(
          "Leaderboard save error:",
          error
        );

        savingScore = false;

        saveButton.disabled = false;

        saveButton.textContent =
          i18n[lang].btnSave;

        document.getElementById("resultText")
          .textContent =
          i18n[lang].saveError;

        alert(
          i18n[lang].saveError +
          "\n\n" +
          i18n[lang].lbRetry
        );
      }
    }


    // ============================================================
    // ЗАГРУЗКА ОБЩЕГО LEADERBOARD
    // ============================================================

    async function loadLeaderboard() {

      const table =
        document.getElementById("lbTable");

      table.innerHTML = "";

      const loadingRow =
        document.createElement("tr");

      const loadingCell =
        document.createElement("td");

      loadingCell.colSpan = 4;

      loadingCell.textContent =
        i18n[lang].lbLoading;

      loadingRow.appendChild(loadingCell);

      table.appendChild(loadingRow);

      try {

        const response =
          await fetch(
            `${LEADERBOARD_API}?action=leaderboard&t=${Date.now()}`,
            {
              method: "GET",
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const result =
          await response.json();

        if (!result.success) {
          throw new Error(
            result.error || "Unknown API error"
          );
        }

        showLeaderboard(
          Array.isArray(result.leaderboard)
            ? result.leaderboard
            : []
        );

      } catch (error) {

        console.error(
          "Leaderboard loading error:",
          error
        );

        table.innerHTML = "";

        const errorRow =
          document.createElement("tr");

        const errorCell =
          document.createElement("td");

        errorCell.colSpan = 4;

        errorCell.className =
          "leaderboard-error";

        errorCell.textContent =
          i18n[lang].lbError;

        errorRow.appendChild(errorCell);

        table.appendChild(errorRow);

        /*
         * Если сохранение уже было выполнено,
         * всё равно показываем экран рейтинга.
         */

        document.getElementById(
          "leaderboardInputSection"
        ).classList.add("hidden");

        document.getElementById(
          "leaderboardViewSection"
        ).classList.remove("hidden");

        savingScore = false;
      }
    }


    // ============================================================
    // ОТОБРАЖЕНИЕ LEADERBOARD
    // ============================================================

    function showLeaderboard(lb) {

      document.getElementById(
        "leaderboardInputSection"
      ).classList.add("hidden");

      document.getElementById(
        "leaderboardViewSection"
      ).classList.remove("hidden");

      const table =
        document.getElementById("lbTable");

      table.innerHTML = "";

      /*
       * Заголовок.
       */

      const header =
        document.createElement("tr");

      const headers = [
        "#",
        "ID",
        "SCORE",
        "DATE"
      ];

      headers.forEach(text => {

        const th =
          document.createElement("th");

        th.textContent = text;

        header.appendChild(th);
      });

      table.appendChild(header);

      /*
       * Если архив пока пуст.
       */

      if (lb.length === 0) {

        const row =
          document.createElement("tr");

        const cell =
          document.createElement("td");

        cell.colSpan = 4;

        cell.textContent =
          lang === "ru"
            ? "АРХИВ ПОКА ПУСТ."
            : "ARCHIVE IS EMPTY.";

        row.appendChild(cell);

        table.appendChild(row);

      } else {

        /*
         * Показываем TOP-10.
         */

        lb.forEach((entry, index) => {

          const tr =
            document.createElement("tr");

          const rankCell =
            document.createElement("td");

          rankCell.textContent =
            String(index + 1);

          const nameCell =
            document.createElement("td");

          nameCell.textContent =
            String(
              entry.name ||
              "VARIANT_UNKNOWN"
            );

          const scoreCell =
            document.createElement("td");

          const total =
            Number(entry.total) ||
            questions.length;

          scoreCell.textContent =
            `${Number(entry.score) || 0}/${total}`;

          const dateCell =
            document.createElement("td");

          dateCell.textContent =
            formatDate(entry.date);

          tr.appendChild(rankCell);
          tr.appendChild(nameCell);
          tr.appendChild(scoreCell);
          tr.appendChild(dateCell);

          table.appendChild(tr);
        });
      }

      savingScore = false;

      const saveButton =
        document.getElementById("uiBtnSave");

      saveButton.disabled = false;

      saveButton.textContent =
        i18n[lang].btnSave;
    }


    // ============================================================
    // ФОРМАТ ДАТЫ
    // ============================================================

    function formatDate(value) {

      if (!value) {
        return "—";
      }

      const date =
        new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleDateString(
        lang === "ru"
          ? "ru-RU"
          : "en-US"
      );
    }


    // ============================================================
    // RESTART
    // ============================================================

    function restart() {

      savingScore = false;

      document.getElementById(
        "resultScreen"
      ).classList.add("hidden");

      document.getElementById(
        "quizContainer"
      ).classList.add("hidden");

      document.getElementById(
        "startScreen"
      ).classList.add("hidden");

      document.getElementById(
        "leaderboardInputSection"
      ).classList.remove("hidden");

      document.getElementById(
        "leaderboardViewSection"
      ).classList.add("hidden");

      document.getElementById(
        "langScreen"
      ).classList.remove("hidden");

      resetMissMinutes();

      document.getElementById(
        "scoreTop"
      ).textContent = "VARS: 0/50";
    }

  </script>
