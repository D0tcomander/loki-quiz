name: Stable TVA visual repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply CSS and SVG corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          s = s.replace('z-index: 48;\n  background: linear-gradient(115deg', 'z-index: 22;\n  background: linear-gradient(115deg', 1)
          s = s.replace('z-index: 50;\n  pointer-events: none;\n  background: radial-gradient', 'z-index: 20;\n  pointer-events: none;\n  background: radial-gradient', 1)
          s = s.replace('z-index: 49;\n  pointer-events: none;\n  opacity: .72;', 'z-index: 21;\n  pointer-events: none;\n  opacity: .72;', 1)
          s = s.replace('z-index: 10;\n  flex-grow: 1;\n  display: flex;\n  flex-direction: column;\n  padding: 22px 30px 28px;', 'z-index: 30;\n  flex-grow: 1;\n  display: flex;\n  flex-direction: column;\n  padding: 22px 30px 28px;', 1)

          s = re.sub(r'\.miss-minutes-container \{.*?\n\}', '''.miss-minutes-container {
            position: absolute;
            bottom: -8px;
            left: -132px;
            width: 220px;
            height: auto;
            z-index: 100;
            animation: float 4s ease-in-out infinite;
            transition: all .3s ease;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,.6));
            pointer-events: none;
          }''', s, count=1, flags=re.S)

          s = s.replace('.terminal-btn.right { align-self:flex-end; }', '.terminal-btn.right { align-self:flex-end; position:relative; z-index:35; flex-shrink:0; }', 1)

          if '.temporal-thread {' not in s:
              css = '''
.temporal-thread { fill:none; stroke:#55d77f; stroke-width:2.2; stroke-linecap:round; opacity:.86; filter:drop-shadow(0 0 4px rgba(69,196,134,.95)) drop-shadow(0 0 11px rgba(69,196,134,.62)); stroke-dasharray:8 6; animation:threadFlow 5s linear infinite; }
.temporal-thread.thread-bright { stroke:#9affbd; stroke-width:3; opacity:.98; filter:drop-shadow(0 0 5px #45c486) drop-shadow(0 0 15px rgba(69,196,134,.9)); }
.temporal-node { fill:#70f0a9; opacity:.98; filter:drop-shadow(0 0 5px #45c486) drop-shadow(0 0 13px rgba(69,196,134,.9)); }
@keyframes threadFlow { to { stroke-dashoffset:-56; } }
'''
              s = s.replace('.nexus-branch {\n', css + '.nexus-branch {\n', 1)

          marker = '''          <path
            id="nexusBranch"
            class="nexus-branch"
            d="M 300 80 Q 450 150 700 130"
          />'''
          if 'class="temporal-threads"' not in s and marker in s:
              s = s.replace(marker, marker + '''
          <g class="temporal-threads" aria-hidden="true">
            <path class="temporal-thread" d="M -20 112 C 105 35 215 38 330 82 S 510 116 635 72 S 765 36 820 55" />
            <path class="temporal-thread thread-bright" d="M -10 132 C 100 74 190 58 292 82 S 445 132 555 102 S 690 48 815 82" />
            <path class="temporal-thread" d="M 30 154 C 125 112 210 92 305 91 S 430 105 510 87 S 665 70 805 108" />
            <path class="temporal-thread" d="M 20 62 C 125 98 205 108 292 91 S 430 42 520 70 S 675 126 805 92" />
            <path class="temporal-thread thread-bright" d="M 112 10 C 165 58 230 74 300 84 S 425 99 500 83 S 635 36 748 44" />
            <path class="temporal-thread" d="M 188 160 C 255 124 292 108 350 91 S 450 54 520 72 S 625 112 790 120" />
            <circle class="temporal-node" cx="400" cy="87" r="4" />
            <circle class="temporal-node" cx="520" cy="83" r="3" />
            <circle class="temporal-node" cx="292" cy="91" r="3" />
          </g>''', 1)

          s = s.replace('.miss-minutes-container { left:-12px; width:100px; bottom:-72px; z-index:1; }', '.miss-minutes-container { left:-20px; width:120px; bottom:-88px; z-index:100; }', 1)
          s = s.replace('.miss-minutes-container { width:82px; left:-8px; bottom:-68px; }', '.miss-minutes-container { width:112px; left:-16px; bottom:-86px; z-index:100; }', 1)

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('CHANGED')
          else:
              print('NO CHANGES')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply stable TVA visual repair [repair2]"
          git push
