name: Fix Miss Minutes layering

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[miss-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix CSS layering and sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "z-index: 48;\n            background: linear-gradient(115deg": "z-index: 22;\n            background: linear-gradient(115deg",
              "z-index: 50;\n            pointer-events: none;\n            background: radial-gradient": "z-index: 20;\n            pointer-events: none;\n            background: radial-gradient",
              "z-index: 49;\n            pointer-events: none;\n            opacity: .72;": "z-index: 21;\n            pointer-events: none;\n            opacity: .72;",
              "z-index: 10;\n            flex-grow: 1;\n            display: flex;": "z-index: 30;\n            flex-grow: 1;\n            display: flex;",
              "left:-108px;\n  width:190px;\n  height:auto;\n  z-index:2;": "left:-132px;\n  width:220px;\n  height:auto;\n  z-index:100;",
              ".terminal-btn.right { align-self:flex-end; }": ".terminal-btn.right { align-self:flex-end; position:relative; z-index:35; flex-shrink:0; }",
              ".miss-minutes-container { left:-12px; width:100px; bottom:-72px; z-index:1; }": ".miss-minutes-container { left:-20px; width:120px; bottom:-88px; z-index:100; }",
              ".miss-minutes-container { width:82px; left:-8px; bottom:-68px; }": ".miss-minutes-container { width:112px; left:-16px; bottom:-86px; z-index:100; }",
          }

          for old, new in replacements.items():
              if old not in text:
                  print('WARNING: pattern not found:', old[:80].replace('\n','\\n'))
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Miss Minutes layering and next button [miss-fix]"
          git push
