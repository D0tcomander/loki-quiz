name: Apply temporal energy patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[temporal-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('z-index: 48;\n  background: linear-gradient(115deg', 'z-index: 22;\n  background: linear-gradient(115deg')
          s = s.replace('z-index: 50;\n  pointer-events: none;\n  background: radial-gradient', 'z-index: 20;\n  pointer-events: none;\n  background: radial-gradient')
          s = s.replace('z-index: 49;\n  pointer-events: none;\n  opacity: .72;', 'z-index: 21;\n  pointer-events: none;\n  opacity: .72;')
          s = s.replace('z-index: 10;\n  flex-grow: 1;\n  display: flex;', 'z-index: 30;\n  flex-grow: 1;\n  display: flex;', 1)

          # Enlarge Miss Minutes, while keeping her outside the answer stack.
          s = s.replace('left:-132px;\n  width:220px;', 'left:-145px;\n  width:240px;', 1)
          s = s.replace('left:-20px; width:120px; bottom:-88px; z-index:100;', 'left:-18px; width:140px; bottom:-98px; z-index:100;')
          s = s.replace('width:112px; left:-16px; bottom:-86px; z-index:100;', 'width:132px; left:-14px; bottom:-94px; z-index:100;')

          # Background temporal energy behind the monitor.
          if 'class="temporal-energy-bg"' not in s:
              css = '''
.temporal-energy-bg {
  position: fixed;
  inset: -12vh -12vw;
  width: 124vw;
  height: 124vh;
  z-index: 1;
  pointer-events: none;
  overflow: visible;
  opacity: .64;
}
.temporal-energy-bg .energy-glow {
  fill: none;
  stroke: #35d878;
  stroke-linecap: round;
  filter: blur(10px);
  opacity: .20;
}
.temporal-energy-bg .energy-thread {
  fill: none;
  stroke: #52e38b;
  stroke-linecap: round;
  opacity: .34;
}
.temporal-energy-bg .energy-thread.faint { opacity: .18; }
.temporal-energy-bg .energy-thread.bright { stroke: #a4ffc3; opacity: .48; }
@media (max-width:900px) {
  .temporal-energy-bg { opacity:.46; inset:-8vh -35vw; width:170vw; height:116vh; }
}
'''
              s = s.replace('</style>', css + '  </style>', 1)
              bg = '''
  <svg class="temporal-energy-bg" viewBox="0 0 1200 900" preserveAspectRatio="none" aria-hidden="true">
    <path class="energy-glow" stroke-width="24" d="M -80 210 C 120 30 250 170 390 80 S 690 30 820 170 S 1080 290 1280 90" />
    <path class="energy-glow" stroke-width="18" d="M -60 720 C 150 560 250 760 430 640 S 700 500 860 660 S 1080 790 1280 560" />
    <path class="energy-thread bright" stroke-width="3" d="M -40 250 C 90 120 210 185 330 105 S 560 65 690 170 S 900 300 1240 120" />
    <path class="energy-thread" stroke-width="2" d="M -20 310 C 120 190 190 285 315 190 S 550 105 730 220 S 970 345 1240 230" />
    <path class="energy-thread faint" stroke-width="1.4" d="M 20 130 C 180 260 270 50 420 145 S 700 270 850 130 S 1080 20 1240 150" />
    <path class="energy-thread" stroke-width="2.2" d="M -50 650 C 100 510 230 600 370 520 S 650 430 800 570 S 1060 720 1260 500" />
    <path class="energy-thread bright" stroke-width="2.8" d="M -40 770 C 130 650 240 745 390 640 S 650 535 790 675 S 1030 820 1250 650" />
  </svg>
'''
              s = s.replace('\n  <div class="tva-monitor">', '\n' + bg + '\n  <div class="tva-monitor">', 1)

          # Subtle green temporal network inside the radar, behind the white Sacred Timeline.
          if 'class="timeline-energy-threads"' not in s:
              inner = '''
          <g class="timeline-energy-threads" aria-hidden="true">
            <path d="M -40 108 C 90 38 170 122 292 66 S 505 34 620 88 S 740 122 840 52" fill="none" stroke="#48df82" stroke-width="1.5" opacity=".34" />
            <path d="M -20 128 C 105 78 190 98 300 76 S 465 54 570 104 S 715 126 835 88" fill="none" stroke="#8dffb3" stroke-width="1.2" opacity=".28" />
            <path d="M 30 52 C 135 115 220 106 315 84 S 470 34 565 70 S 700 125 815 106" fill="none" stroke="#42d878" stroke-width="1.3" opacity=".26" />
            <path d="M 90 154 C 185 105 255 112 340 86 S 490 64 575 92 S 710 110 805 132" fill="none" stroke="#5be88d" stroke-width="1" opacity=".20" />
          </g>
'''
              marker = '''          <path
            class="sacred-path"
            d="M -50 80 Q 150 30 300 80 T 600 80 T 900 80"
          />'''
              if marker not in s:
                  raise SystemExit('Sacred Timeline marker not found')
              s = s.replace(marker, inner + '\n' + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'class="temporal-energy-bg"',
              'class="timeline-energy-threads"',
              'width:240px;',
              'width:140px;',
              'z-index:35;',
              'z-index:30;',
              'z-index:20;'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing: ' + ', '.join(missing))
          print('Temporal patch verified.')
          PY

      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply temporal energy visual patch [temporal-applied]"
          git push
